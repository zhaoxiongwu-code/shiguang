<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>时光</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbf8f4; --fg: #2b2523; --muted: #7a6f68; --line: #e6ded5;
    --accent: #c9631f; --accent-soft: #fdf0e4; --ok: #1f7a4d; --err: #b03a2e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17120f; --fg: #ece4dc; --muted: #a2958c; --line: #352b26;
            --accent: #f0924a; --accent-soft: #2a1f17; --ok: #4cc38a; --err: #ff7b6b; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 340px; background: var(--bg); color: var(--fg);
    font: 13px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 8px; }
  .head .name { font-weight: 600; letter-spacing: .04em; }
  .head .name::before {
    content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px;
    background: linear-gradient(135deg, #e8833a, #b4462a); margin-right: 7px; vertical-align: 1px;
  }
  .head button { font: inherit; font-size: 12px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 2px 4px; }
  .head button:hover { color: var(--accent); }

  .body { padding: 0 14px 12px; }
  .page {
    border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; margin-bottom: 10px;
    background: rgba(128,128,128,.04);
  }
  .page .t { font-weight: 600; font-size: 12.5px; line-height: 1.45; max-height: 2.9em; overflow: hidden;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .page .u { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

  label.field { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; letter-spacing: .02em; }
  input[type=text] {
    width: 100%; font: inherit; font-size: 12.5px; padding: 6px 8px; border: 1px solid var(--line);
    border-radius: 7px; background: var(--bg); color: var(--fg);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .opts { display: flex; gap: 14px; margin: 10px 0 12px; }
  .opts label { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .opts input { accent-color: var(--accent); margin: 0; }

  .btn {
    width: 100%; font: inherit; font-size: 13px; font-weight: 600; padding: 9px; border-radius: 8px;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer;
    letter-spacing: .04em;
  }
  .btn:hover { filter: brightness(1.07); }
  .btn:disabled { opacity: .6; cursor: default; filter: none; }

  .status { margin-top: 10px; font-size: 12px; min-height: 1.4em; color: var(--muted); }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }

  .progress { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 10px; display: none; }
  .progress.on { display: block; }
  .progress i { display: block; height: 100%; width: 35%; background: var(--accent); border-radius: 2px;
                animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(385%); } }

  .result { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 12px; display: none; }
  .result.on { display: block; }
  .result .line { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
  .result .line b { font-weight: 600; color: var(--fg); }
  .result a { display: inline-block; margin-top: 7px; color: var(--accent); text-decoration: none; font-weight: 600; }
  .result a:hover { text-decoration: underline; }
  .warn { margin-top: 6px; font-size: 11px; color: var(--err); }

  .setup { display: none; padding: 4px 0 6px; }
  .setup.on { display: block; }
  .setup p { margin: 0 0 10px; color: var(--muted); font-size: 12.5px; }
  .setup button { width: 100%; font: inherit; font-size: 13px; padding: 9px; border-radius: 8px;
                  border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <div class="head">
    <span class="name">时光</span>
    <button id="settingsBtn" type="button">设置</button>
  </div>

  <div class="body">
    <div id="mainView">
      <div class="page">
        <div class="t" id="pageTitle">读取中…</div>
        <div class="u" id="pageUrl"></div>
      </div>

      <div>
        <label class="field" for="tags">标签（可选）</label>
        <input id="tags" type="text" placeholder="逗号分隔" spellcheck="false">
      </div>

      <div class="opts">
        <label><input id="optImages" type="checkbox"> 保存图片</label>
        <label><input id="optHtml" type="checkbox"> 保存 HTML</label>
      </div>

      <button class="btn" id="saveBtn" type="button">保存到 GitHub</button>

      <div class="progress" id="progress"><i></i></div>
      <div class="status" id="status"></div>

      <div class="result" id="result">
        <div class="line"><span>文件夹</span><b id="rFolder"></b></div>
        <div class="line"><span>图片</span><b id="rImages"></b></div>
        <div class="line"><span>提交</span><b id="rCommit"></b></div>
        <div class="warn" id="rWarn"></div>
        <a id="rLink" href="#" target="_blank" rel="noreferrer">在 GitHub 上查看 →</a>
      </div>
    </div>

    <div class="setup" id="setupView">
      <p>还没有配置 GitHub 仓库。填好访问令牌后就能开始收藏。</p>
      <button id="openOptions" type="button">打开设置</button>
    </div>
  </div>

<script type="module" src="popup.js"></script>
</body>
</html>
